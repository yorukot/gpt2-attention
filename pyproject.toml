[project]
name = "gpt2-attention"
version = "0.1.0"
description = "Reproduce and analyze attention patterns in GPT-2 Small."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tokenizers>=0.23.2",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.18.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
